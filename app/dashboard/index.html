<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Database</title>
<style>
:root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --line: #dde2e8;
    --accent: #1f6feb; --good: #1a7f37; --bad: #cf222e; --flag: #9a6700; --chip: #eef1f5;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #9aa5b3; --line: #2a313b;
        --accent: #4c9aff; --good: #3fb950; --bad: #f85149; --flag: #d29922; --chip: #222933;
    }
}
:root[data-theme="dark"] {
    --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #9aa5b3; --line: #2a313b;
    --accent: #4c9aff; --good: #3fb950; --bad: #f85149; --flag: #d29922; --chip: #222933;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 18px; margin: 0; }
#summary { color: var(--muted); }
header .spacer { flex: 1; }
nav a { margin-right: 14px; color: var(--muted); text-decoration: none; font-weight: 600; white-space: nowrap; }
nav a.active { color: var(--accent); }
nav .dot { display: none; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-left: 5px; vertical-align: 1px; }
nav .dot.on { display: inline-block; }
main { padding: 16px; max-width: 1500px; margin: 0 auto; }
button, .button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer; }
button.secondary { background: var(--chip); color: var(--text); }
input, select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
input[type="checkbox"] { vertical-align: -2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
.panel h2 { font-size: 15px; margin: 0 0 10px; }
.panel h3 { font-size: 13px; margin: 14px 0 8px; color: var(--muted); }
.panel > :last-child { margin-bottom: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child, td.left, th.left { text-align: left; }
th { font-size: 12px; color: var(--muted); font-weight: 600; cursor: default; user-select: none; }
th.sortable { cursor: pointer; }
th.sorted { color: var(--accent); }
th.group { text-align: center; border-bottom: 2px solid var(--line); }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--chip); }
tr.away td { opacity: 0.6; }
.n { color: var(--muted); font-size: 11px; margin-left: 3px; }
.chip { display: inline-block; background: var(--chip); border-radius: 10px; padding: 1px 8px; font-size: 12px; margin-left: 6px; }
.you { background: var(--accent); color: #fff; }
.live { background: var(--good); color: #fff; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.flag { color: var(--flag); }
tr.sub td { white-space: normal; text-align: left; padding-top: 0; font-size: 13px; }
tr:has(+ tr.sub) td { border-bottom: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.stat { background: var(--chip); border-radius: 6px; padding: 8px 10px; }
.stat .label { font-size: 12px; color: var(--muted); }
.stat .value { font-size: 18px; font-weight: 600; }
.averages { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 8px; }
.averages span { white-space: nowrap; }
.averages b { margin-left: 4px; }
ul.plain { margin: 0; padding-left: 18px; }
#drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(31, 111, 235, 0.18); border: 3px dashed var(--accent); font-size: 22px; font-weight: 600; z-index: 10; }
#drop.show { display: flex; }
#import-results:empty { display: none; }
.cards { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
a { color: var(--accent); }
@media (max-width: 640px) { header h1 { font-size: 16px; } main { padding: 12px 16px; } .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } }
</style>
</head>
<body>
<header>
    <h1>PokerNow player database</h1>
    <span id="summary"></span>
    <span class="spacer"></span>
    <nav><a href="#/now" id="nav-now" title="The game being played right now">Now<span class="dot" id="live-dot"></span></a><a href="#/players" id="nav-players">Players</a><a href="#/games" id="nav-games">Games</a><a href="#/results" id="nav-results">Results</a><a href="#/leaks" id="nav-leaks" title="Where you lose money, from your stored hands">Your leaks</a></nav>
    <label class="button" for="file-input">Import logs</label>
    <input id="file-input" type="file" accept=".csv,text/csv" multiple hidden>
</header>
<div id="drop">Drop PokerNow log files (.csv) to import</div>
<main>
    <div id="import-results" class="panel"></div>
    <div id="view"></div>
</main>
<script>
"use strict";
// All content is built with textContent / DOM nodes (never innerHTML), since player names come from logs.
// Stats in display order, grouped before / after the flop. `more`: in the players table only with
// "More stats" on. A stat the server doesn't send is skipped everywhere.
const STATS = [
    { key: "vpip", label: "VPIP", title: "Put money in voluntarily preflop", group: "pre" },
    { key: "pfr", label: "PFR", title: "Raised preflop", group: "pre" },
    { key: "three_bet", label: "3-bet", title: "Re-raised when facing exactly one preflop raise", group: "pre" },
    { key: "limp", label: "Limp", title: "Just called when first to put money in", group: "pre" },
    { key: "steal", label: "Steal", title: "Raised first in from CO, BU or SB", group: "pre", more: true },
    { key: "fold_to_steal", label: "Fold to steal", title: "In the blinds, folded to a late-position open", group: "pre", more: true },
    { key: "fold_to_three_bet", label: "Fold to 3-bet", title: "Opened, then folded to a re-raise", group: "pre" },
    { key: "cbet", label: "C-bet", title: "Bet the flop as the preflop raiser", group: "post" },
    { key: "fold_to_cbet", label: "Fold to c-bet", title: "Folded to the preflop raiser's flop bet", group: "post" },
    { key: "fold_to_bet_flop", label: "Fold to flop bet", title: "Folded when facing a bet on the flop", group: "post", more: true },
    { key: "fold_to_bet_turn", label: "Fold to turn bet", title: "Folded when facing a bet on the turn", group: "post", more: true },
    { key: "fold_to_bet_river", label: "Fold to river bet", title: "Folded when facing a bet on the river", group: "post", more: true },
    { key: "raise_vs_bet", label: "Raises vs bet", title: "Raised when facing a bet after the flop", group: "post", more: true },
    { key: "bet_when_checked_to", label: "Bets when checked to", title: "Bet after the flop when nobody had bet yet and it was their turn", group: "post", more: true },
    { key: "aggression", label: "Aggression", title: "Post-flop bets and raises as a share of bets, raises, calls and folds", group: "post" },
    { key: "went_to_showdown", label: "WTSD", title: "Went to showdown after seeing the flop", group: "post" },
    { key: "won_at_showdown", label: "W$SD", title: "Won when going to showdown", group: "post" }
];
const GAME_STATS = ["vpip", "pfr", "three_bet", "aggression", "fold_to_cbet", "went_to_showdown"];
const STAT = Object.fromEntries(STATS.map((s) => [s.key, s]));
// where a suggestion came from (unknown ones are shown as sent)
const SOURCE_NAMES = { engine: "Engine (clear spots)", llm: "AI model (close spots)", "engine-fallback": "Engine (when the AI failed)" };
const REFRESH_MS = 15000;

function el(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
        if (v === undefined || v === null || v === false) continue;
        if (k === "class") e.className = v;
        else if (k === "text") e.textContent = v;
        else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v === true ? "" : String(v));
    }
    for (const kid of kids.flat(Infinity)) {
        if (kid === null || kid === undefined || kid === false) continue;
        e.append(kid instanceof Node ? kid : String(kid));
    }
    return e;
}
// replaceChildren, skipping empty parts (it would show a null as the text "null")
const fill = (parent, ...kids) => parent.replaceChildren(...kids.flat(Infinity).filter((k) => k !== null && k !== undefined && k !== false));
const pct =(x) => `${Math.round(x * 100)}%`;
const raw = (r) => r && r.n ? pct(r.k / r.n) : "-";
const num = (x, d = 1) => (x >= 0 ? "+" : "") + x.toFixed(d);
const when = (iso) => iso ? new Date(iso).toLocaleString([], { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "-";
const signed = (x, d = 1) => el("span", { class: x >= 0 ? "pos" : "neg" }, num(x, d));
function ago(iso) {
    const minutes = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    return minutes < 1 ? "just now" : minutes < 60 ? `${minutes} min ago` : when(iso);
}
// the stats this server sends, in display order
const present = (rates) => STATS.filter((s) => rates && rates[s.key]);
async function api(path, body) {
    let res;
    try {
        res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : undefined);
    } catch {
        throw new Error("The stats page is not running. It stops when the bot stops: run npm start (or npm run dashboard) in Terminal, then reload this page.");
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
}
function remember(key, value) {
    try { if (value === undefined) return JSON.parse(localStorage.getItem(key)); localStorage.setItem(key, JSON.stringify(value)); } catch { return null; }
}
function rateCell(r, title) {
    // estimate (what the bot uses) with the raw sample next to it
    return el("td", { title: `${title}: ${r.k}/${r.n} raw, estimate ${pct(r.value)}` }, pct(r.value), el("span", { class: "n" }, r.n));
}
function nameCell(p, show_id, ...extra) {
    return el("td", { class: "left" }, p.name, p.is_me ? el("span", { class: "chip you" }, "YOU") : null,
        show_id && !p.is_me ? el("span", { class: "n cards" }, p.key) : null,
        p.names && p.names.length > 1 ? el("span", { class: "n", title: p.names.join(", ") }, `+${p.names.length - 1} name${p.names.length > 2 ? "s" : ""}`) : null, ...extra);
}

// the same name on different PokerNow ids: show the id so they can be told apart
function repeatedNames(list) {
    const seen = new Map();
    for (const p of list) seen.set(p.name, (seen.get(p.name) || 0) + 1);
    return new Set([...seen.entries()].filter(([, n]) => n > 1).map(([name]) => name));
}

// ---------- summary (header counts and your games' averages) ----------
let summary = null;
async function loadSummary() {
    summary = await api("/api/summary");
    document.getElementById("summary").textContent = `${summary.games.length} games · ${summary.hands} hands · ${summary.players} players`;
    return summary;
}
const average = (key) => summary && summary.pool && summary.pool.rates[key] !== undefined ? summary.pool.rates[key] : null;

function averagesPanel() {
    const pool = summary && summary.pool;
    if (!pool) return null;
    return el("div", { class: "panel" },
        el("h2", {}, "Your games on average"),
        el("div", { class: "averages" }, ...STATS.filter((s) => pool.rates[s.key] !== undefined).map((s) =>
            el("span", { title: s.title }, s.label, el("b", {}, pct(pool.rates[s.key]))))),
        el("p", { class: "muted small" }, pool.hands
            ? `How your opponents play, from ${pool.hands} of their hands. Players the bot knows little about are assumed to play like this.`
            : "No opponent hands yet, so these are built-in guesses for a loose home game. They update as you play or import logs."));
}

// ---------- players ----------
const state = Object.assign({ search: "", min_hands: 20, sort: "hands", dir: -1, more: false }, remember("players-view") || {});
let players_cache = [];

async function showPlayers(view) {
    // the averages are extra: the table still shows if they can't be loaded
    [players_cache] = await Promise.all([api("/api/players"), loadSummary().catch(() => null)]);
    const stats = present(players_cache[0] && players_cache[0].rates);
    const extra = stats.filter((s) => s.more);
    const search = el("input", { type: "search", placeholder: "Search name or id", value: state.search });
    const min = el("input", { type: "number", min: 0, value: state.min_hands, style: "width:80px" });
    const more = el("input", { type: "checkbox" });
    more.checked = !!state.more;
    const body = el("tbody");
    const head = el("tr");
    const value = (p, key) => p.rates && p.rates[key] ? p.rates[key].value : p[key];
    const render = () => {
        remember("players-view", state);
        const shown = stats.filter((s) => state.more || !s.more);
        const columns = [
            ["name", "Player", "left"], ["type", "Type", "left"], ["hands", "Hands"], ["games", "Games"],
            ...shown.map((s) => [s.key, s.label, "", average(s.key) === null ? s.title : `${s.title}. Your games' average: ${pct(average(s.key))}`]),
            ["bb_per_100", "BB/100"], ["net_bb", "Net BB"], ["last_seen", "Last seen"]
        ];
        // a hidden or missing column can't stay the sort order
        if (!columns.some(([key]) => key === state.sort)) { state.sort = "hands"; state.dir = -1; }
        head.replaceChildren(...columns.map(([key, label, cls, title]) => el("th", {
            class: `sortable ${cls || ""} ${state.sort === key ? "sorted" : ""}`, title,
            onclick: () => { state.dir = state.sort === key ? -state.dir : (key === "name" || key === "type" ? 1 : -1); state.sort = key; render(); }
        }, label + (state.sort === key ? (state.dir > 0 ? " ▲" : " ▼") : ""))));
        const q = state.search.trim().toLowerCase();
        const rows = players_cache
            .filter((p) => p.hands >= state.min_hands || p.is_me)
            .filter((p) => !q || p.key.toLowerCase().includes(q) || p.names.some((n) => n.toLowerCase().includes(q)))
            .sort((a, b) => {
                const x = value(a, state.sort), y = value(b, state.sort);
                return (typeof x === "string" ? x.localeCompare(y) : x - y) * state.dir;
            });
        const repeated = repeatedNames(rows);
        body.replaceChildren(...rows.map((p) => el("tr", { class: "clickable", onclick: () => { location.hash = `#/player/${encodeURIComponent(p.key)}`; } },
            nameCell(p, repeated.has(p.name)), el("td", { class: "left", title: p.exploit }, p.type), el("td", {}, p.hands), el("td", {}, p.games),
            ...shown.map((s) => rateCell(p.rates[s.key], s.label)),
            el("td", {}, signed(p.bb_per_100)), el("td", {}, signed(p.net_bb, 0)), el("td", {}, when(p.last_seen))
        )));
        count.textContent = `${rows.length} of ${players_cache.length} players`;
    };
    const count = el("span", { class: "muted" });
    search.addEventListener("input", () => { state.search = search.value; render(); });
    min.addEventListener("input", () => { state.min_hands = Number(min.value) || 0; render(); });
    more.addEventListener("change", () => { state.more = more.checked; render(); });
    fill(view,
        averagesPanel(),
        el("div", { class: "panel" },
            el("div", { class: "toolbar" }, search, el("label", {}, "Min hands ", min),
                extra.length ? el("label", { title: `Also show: ${extra.map((s) => s.label).join(", ")}` }, more, " More stats") : null, count),
            el("div", { class: "scroll" }, el("table", {}, el("thead", {}, head), body)),
            el("p", { class: "muted" }, "Percentages are estimates: small samples are pulled toward your games' averages, so a player needs a few dozen chances before a stat means much. The small number is how many chances the stat had. Hover over a column name for what it means. Results (BB/100, Net BB) include every hand; the tendency stats count Hold'em hands only, without bomb pots.")));
    render();
}

function statTile(s, r) {
    const avg = average(s.key);
    return el("div", { class: "stat", title: s.title },
        el("div", { class: "label" }, s.label), el("div", { class: "value" }, pct(r.value)),
        el("div", { class: "n" }, `${r.k}/${r.n} raw (${raw(r)})`),
        avg === null ? null : el("div", { class: "n" }, `Your games: ${pct(avg)}`));
}

async function showPlayer(view, key) {
    const [p] = await Promise.all([api(`/api/players/${encodeURIComponent(key)}`), summary ? null : loadSummary().catch(() => null)]);
    if (!players_cache.length) players_cache = await api("/api/players");
    const stats = present(p.rates);
    const tiles = (group) => el("div", { class: "grid" }, ...stats.filter((s) => s.group === group).map((s) => statTile(s, p.rates[s.key])));
    const positions = el("div", { class: "grid" }, ...["early", "middle", "late", "blinds"].map((g) => el("div", { class: "stat" },
        el("div", { class: "label" }, `VPIP ${g}`), el("div", { class: "value" }, pct(p.vpip_by_position[g].value)),
        el("div", { class: "n" }, `${p.vpip_by_position[g].k}/${p.vpip_by_position[g].n} raw`))),
        el("div", { class: "stat" }, el("div", { class: "label" }, "Average bet size"),
            el("div", { class: "value" }, p.bets_seen ? `${pct(p.avg_bet_to_pot)} pot` : "-"), el("div", { class: "n" }, `${p.bets_seen} bets`)));

    const game_stats = GAME_STATS.filter((k) => p.rates[k]);
    const games = el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "Game"), el("th", {}, "Hands"), ...game_stats.map((k) => el("th", { title: STAT[k].title }, STAT[k].label)), el("th", {}, "BB/100"), el("th", {}, "Net BB"))),
        el("tbody", {}, ...p.games.map((g) => el("tr", { class: "clickable", onclick: () => { location.hash = `#/game/${encodeURIComponent(g.game_id)}`; } },
            el("td", { class: "left" }, when(g.first_at), el("span", { class: "n" }, g.game_id)), el("td", {}, g.hands),
            ...game_stats.map((k) => el("td", { title: `${g.rates[k].k}/${g.rates[k].n}` }, raw(g.rates[k]), el("span", { class: "n" }, g.rates[k].n))),
            el("td", {}, signed(g.bb_per_100)), el("td", {}, signed(g.net_bb, 0))))));

    const showdowns = p.showdowns.length ? el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "When"), el("th", { class: "left" }, "Cards"), el("th", { class: "left" }, "Board"), el("th", { class: "left" }, "Their line"), el("th", {}, "Result"))),
        el("tbody", {}, ...p.showdowns.map((s) => el("tr", {},
            el("td", { class: "left" }, when(s.at)), el("td", { class: "left cards" }, s.cards.join(" ")),
            el("td", { class: "left cards" }, s.board.join(" ") || "-"), el("td", { class: "left" }, s.line),
            el("td", {}, el("span", { class: s.won ? "pos" : "neg" }, s.won ? "won" : "lost"))))))
        : el("p", { class: "muted" }, "No shown cards recorded.");

    const others = players_cache.filter((o) => o.key !== p.key).sort((a, b) => a.name.localeCompare(b.name));
    const pick = el("select", {}, el("option", { value: "" }, "Pick a player..."),
        ...others.map((o) => el("option", { value: o.key }, `${o.name} (${o.hands} hands, ${o.key})`)));
    const merge = el("button", { class: "secondary", onclick: async () => {
        if (!pick.value) return;
        const other = others.find((o) => o.key === pick.value);
        if (!confirm(`Treat ${other.name} (${other.key}) as the same person as ${p.name}? Their hands will be combined.`)) return;
        await api("/api/link", { a: p.key, b: pick.value });
        route();
    } }, "Same person");
    const ids = p.ids.length ? p.ids : [p.key];
    const id_list = el("ul", { class: "plain" }, ...ids.map((id) => el("li", {}, el("span", { class: "cards" }, id), " ",
        p.ids.includes(id) && id !== p.key ? el("button", { class: "secondary", onclick: async () => {
            if (!confirm(`Split ${id} back out into its own player?`)) return;
            await api("/api/unlink", { id });
            route();
        } }, "Split out") : null)));

    view.replaceChildren(
        el("p", {}, el("a", { href: "#/players" }, "← All players")),
        el("div", { class: "panel" },
            el("h2", {}, p.name, p.is_me ? el("span", { class: "chip you" }, "YOU") : null, el("span", { class: "chip" }, p.type)),
            el("p", {}, `${p.hands} Hold'em hands over ${p.games.length} game(s) · `, signed(p.bb_per_100), " BB/100 · ", signed(p.net_bb, 0), ` BB total · last seen ${when(p.last_seen)}`),
            p.exploit ? el("p", {}, el("strong", {}, "How to exploit: "), p.exploit) : null,
            p.names.length > 1 ? el("p", { class: "muted" }, `Also played as: ${p.names.slice(1).join(", ")}`) : null),
        el("div", { class: "panel" }, el("h2", {}, "Most recent game vs their usual play"),
            p.latest_vs_usual.length ? el("ul", { class: "plain" }, ...p.latest_vs_usual.map((t) => el("li", { class: "flag" }, t)))
                : el("p", { class: "muted" }, p.games.length > 1 ? "No clear differences. A stat is flagged only with 15+ chances in that game and a gap bigger than 10 points and random noise." : "Only one game so far, so there is nothing to compare against.")),
        el("div", { class: "panel" }, el("h2", {}, "Tendencies (all games)"),
            el("p", { class: "muted small" }, "Big number: the estimate the bot uses. Below it: the raw count, and the average player in your games for comparison. Hover over a box for what it means."),
            el("h3", {}, "Before the flop"), tiles("pre"), el("h3", {}, "After the flop"), tiles("post")),
        el("div", { class: "panel" }, el("h2", {}, "By position"), positions),
        el("div", { class: "panel" }, el("h2", {}, "Game by game (raw numbers, newest first)"), el("div", { class: "scroll" }, games)),
        el("div", { class: "panel" }, el("h2", {}, `Shown cards (last ${p.showdowns.length})`), el("div", { class: "scroll" }, showdowns)),
        el("div", { class: "panel" }, el("h2", {}, "Identity"),
            el("p", { class: "muted" }, "PokerNow ids are tracked, not names, because names change between games. If this person also played under another id, mark it here."),
            id_list, el("div", { class: "toolbar", style: "margin-top:10px" }, pick, merge))
    );
}

// ---------- games ----------
async function showGames(view) {
    const [games, live] = await Promise.all([api("/api/games"), api("/api/live").catch(() => null)]);
    // the game in progress opens in the Now view
    const inProgress = (g) => !!live && g.game_id === live.game_id;
    view.replaceChildren(el("div", { class: "panel" }, el("h2", {}, "Games"),
        el("div", { class: "scroll" }, el("table", {},
            el("thead", {}, el("tr", {}, el("th", {}, "Started"), el("th", {}, "Last hand"), el("th", { class: "left" }, "Source"), el("th", { class: "left" }, "Game id"), el("th", {}, "Hands"))),
            el("tbody", {}, ...games.map((g) => el("tr", { class: "clickable", onclick: () => { location.hash = inProgress(g) ? "#/now" : `#/game/${encodeURIComponent(g.game_id)}`; } },
                el("td", { class: "left" }, when(g.first_at)), el("td", {}, when(g.last_at)),
                el("td", { class: "left" }, g.source === "live" ? "played live" : `imported ${g.file_name || ""}`, inProgress(g) ? el("span", { class: "chip live" }, "playing now") : null),
                el("td", { class: "left cards" }, g.game_id), el("td", {}, g.hands))))))));
}

// auto-refresh (views return whether they want it): a hidden browser tab waits and refreshes as
// soon as it is shown again
let refresh_timer = null;
let refresh_waiting = false;
function scheduleRefresh(on) {
    clearTimeout(refresh_timer);
    refresh_waiting = false;
    if (!on) return;
    const hash = location.hash;
    refresh_timer = setTimeout(() => {
        if (location.hash !== hash) return;
        if (document.hidden) refresh_waiting = true;
        else route();
    }, REFRESH_MS);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && refresh_waiting) route(); });

async function showGame(view, id, live = false) {
    const { game, players } = await api(`/api/games/${encodeURIComponent(id)}`);
    const stats = GAME_STATS.filter((k) => !players.length || players[0].session.rates[k]);
    const repeated = repeatedNames(players.map((p) => p.session));
    // the live game refreshes by default; any other game only if you turned it on
    const setting = live ? "now-auto-refresh" : "auto-refresh";
    const auto = el("input", { type: "checkbox" });
    auto.checked = live ? remember(setting) !== false : remember(setting) === true;
    auto.addEventListener("change", () => { remember(setting, auto.checked); scheduleRefresh(auto.checked); });
    // right now, the players still at the table matter most
    if (live) players.sort((a, b) => (b.seated ? 1 : 0) - (a.seated ? 1 : 0) || b.session.hands - a.session.hands);
    const cell = (p, k) => {
        const g = p.session.rates[k];
        const u = p.usual ? p.usual.rates[k] : null;
        return el("td", { title: `this game ${g.k}/${g.n}${u ? `, usually ${pct(u.value)} over ${u.n} chances` : ""}` },
            raw(g), el("span", { class: "n" }, g.n), u ? el("span", { class: "muted" }, ` · ${pct(u.value)}`) : null);
    };
    const away = (p) => live && !p.seated;
    const intro = live
        ? [el("h2", {}, "Your game right now", el("span", { class: "chip live" }, "live")),
            el("p", {}, `${game.hands} hands so far · last hand ${ago(game.last_at)} · `, el("span", { class: "cards" }, game.game_id)),
            el("label", {}, auto, ` Refresh every 15 seconds (last updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })})`)]
        : [el("h2", {}, `Game ${game.game_id}`),
            el("p", {}, `${game.hands} hands · ${when(game.first_at)} to ${when(game.last_at)} · ${game.source === "live" ? "played live" : "imported"}`),
            el("label", {}, auto, " Refresh every 15 seconds (for the game you are playing now)")];
    const table = el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "Player"), el("th", {}, "Hands"), ...stats.map((k) => el("th", { title: STAT[k].title }, STAT[k].label)),
            el("th", {}, "Net BB"), el("th", { class: "left" }, "Usually → now"))),
        el("tbody", {}, ...players.map((p) => [el("tr", { class: `clickable ${away(p) ? "away" : ""}`, onclick: () => { location.hash = `#/player/${encodeURIComponent(p.key)}`; } },
            nameCell({ ...p.session, key: p.key, is_me: p.is_me, names: [] }, repeated.has(p.session.name),
                away(p) ? el("span", { class: "chip", title: "Not dealt into the most recent hand: left the table or sitting out" }, "away") : null),
            el("td", {}, p.session.hands, p.usual ? el("span", { class: "n" }, `of ${p.usual.hands + p.session.hands}`) : null),
            ...stats.map((k) => cell(p, k)),
            el("td", {}, signed(p.session.net_bb, 0)),
            el("td", { class: "left" }, p.usual ? `${p.usual.type} → ${p.current.type}` : `new: ${p.session.type}`)),
            p.deviations.length ? el("tr", { class: "sub" }, el("td", { colspan: stats.length + 4, class: "flag" }, p.deviations.map((d) => `⚑ ${d}`).join("   "))) : null
        ])));
    fill(view,
        live ? null : el("p", {}, el("a", { href: "#/games" }, "← All games")),
        el("div", { class: "panel" }, ...intro),
        el("div", { class: "panel" },
            el("h2", {}, live ? "How each player is playing today" : "How each player is playing in this game"),
            el("p", { class: "muted" }, "Each cell: this game's raw number, the number of chances, then their usual estimate from every other game. ⚑ marks a clear difference. Click a player for everything about them."),
            el("div", { class: "scroll" }, table)));
    return auto.checked;
}

// ---------- now ----------
function setLiveDot(on) { document.getElementById("live-dot").classList.toggle("on", on); }

async function showNow(view, live) {
    if (live === undefined) live = await api("/api/live");
    setLiveDot(!!live);
    if (live) return showGame(view, live.game_id, true);
    view.replaceChildren(el("div", { class: "panel" },
        el("h2", {}, "No game in progress"),
        el("p", {}, "While the bot is playing, this page shows everyone in your game and how they are playing today, and updates itself every 15 seconds. The game shows up here once its first hand is finished."),
        el("p", {}, el("a", { href: "#/players" }, "See all players"), " · ", el("a", { href: "#/games" }, "See past games"))));
    // keep checking, so the page switches over by itself when a game starts
    return true;
}

// ---------- results ----------
async function showResults(view) {
    const r = await api("/api/results");
    const sources = r.sources || [];
    const note = r.note ? el("p", { class: "muted" }, r.note) : null;
    if (!sources.length) {
        view.replaceChildren(el("div", { class: "panel" }, el("h2", {}, "How the suggestions worked out"),
            note || el("p", { class: "muted" }, "No tracked suggestions yet. They are recorded while the bot runs.")));
        return;
    }
    const has = (g) => g && g.hands > 0;
    const side = (g) => [
        el("td", {}, has(g) ? g.hands : "0"),
        el("td", {}, has(g) ? signed(g.bb_per_100) : "-"),
        el("td", { class: "muted" }, has(g) && Number.isFinite(g.ci_low) && Number.isFinite(g.ci_high) ? `${num(g.ci_low)} to ${num(g.ci_high)}` : "-")
    ];
    const range_title = "95% range: the true result is very likely somewhere in here. If it goes from below 0 to above 0, there is not enough data yet to tell.";
    view.replaceChildren(el("div", { class: "panel" },
        el("h2", {}, "How the suggestions worked out"),
        el("p", {}, "For each kind of suggestion: how often you followed it, and how you did (in big blinds per 100 hands) when you followed it and when you did not."),
        el("div", { class: "scroll" }, el("table", {},
            el("thead", {},
                el("tr", {}, el("th", { colspan: 3 }), el("th", { class: "group", colspan: 3 }, "When you followed it"), el("th", { class: "group", colspan: 3 }, "When you did something else")),
                el("tr", {}, el("th", {}, "Suggested by"), el("th", {}, "Decisions"), el("th", {}, "Followed"),
                    ...[1, 2].flatMap(() => [el("th", {}, "Hands"), el("th", {}, "BB/100"), el("th", { title: range_title }, "95% range")]))),
            el("tbody", {}, ...sources.map((s) => el("tr", {},
                el("td", { class: "left" }, SOURCE_NAMES[s.source] || s.source),
                el("td", {}, s.decisions), el("td", {}, Number.isFinite(s.follow_rate) ? pct(s.follow_rate) : "-"),
                ...side(s.followed), ...side(s.not_followed)))))),
        el("p", { class: "muted small" }, range_title),
        note));
}

// ---------- your leaks ----------
const LEAK_AREAS = [["preflop", "Results by preflop line and seat"], ["postflop", "Results by what you did after the flop"],
    ["frequency", "Your stats against your games' average player"], ["river", "River checks"]];
async function showLeaks(view) {
    const r = await api("/api/leaks");
    const value = (l) => l.result
        ? [signed(l.result.bb_per_100), " BB/100 ", el("span", { class: "muted" }, Number.isFinite(l.result.ci_low) ? `(95% range ${num(l.result.ci_low)} to ${num(l.result.ci_high)})` : "(too few to tell)")]
        : [`${pct(l.rate)} `, el("span", { class: "muted" }, `vs ${pct(l.benchmark)}`)];
    const row = (l) => el("tr", {},
        el("td", { class: "left", title: l.note }, l.label, l.flagged ? el("span", { class: "chip", title: "Passed the bar for a finding" }, "finding") : null),
        el("td", {}, l.n), el("td", { class: "left" }, ...value(l)),
        el("td", { class: "muted" }, Number.isFinite(l.z) ? num(l.z) : "-"));
    const flagged = r.lines.filter((l) => l.flagged);
    const sections = LEAK_AREAS.map(([area, title]) => {
        const lines = r.lines.filter((l) => l.area === area && (l.n >= 20 || area === "river"));
        if (!lines.length) return null;
        return [el("h3", {}, title), el("div", { class: "scroll" }, el("table", {},
            el("thead", {}, el("tr", {}, el("th", { class: "left" }, "Spot"), el("th", {}, "Hands"), el("th", { class: "left" }, "You"), el("th", { title: "Gap in standard errors" }, "z"))),
            el("tbody", {}, ...lines.map(row))))];
    }).filter(Boolean).flat();
    view.replaceChildren(el("div", { class: "panel" },
        el("h2", {}, "Your leaks"),
        el("p", {}, `From ${r.hands} of your Hold'em hands with known cards. ${r.tested} lines had enough data to test (20+ hands or chances); a line is a finding only when it is at least ${Number.isFinite(r.z_bar) ? r.z_bar.toFixed(1) : "-"} standard errors out, the bar that keeps the chance of any false finding across all of them near 5%.`),
        el("p", { class: "muted small" }, "Results by line are correlational: the cards you were dealt decide most of them. Stats are compared with the average other player in your games, and different isn't wrong by itself. River checks compare what happened with what the price needed. Run npm run leaks for the spots where you went against the engine."),
        el("h3", {}, "Findings"),
        flagged.length ? el("ul", { class: "plain" }, ...flagged.map((l) => el("li", {}, el("b", {}, l.label), ": ", ...value(l), el("div", { class: "muted small" }, l.note))))
            : el("p", { class: "muted" }, "None clear yet: nothing passed the bar. More hands are needed, or there is no large leak in these lines."),
        ...sections));
}

// ---------- import ----------
async function importFiles(files) {
    const list = [...files].filter((f) => /\.csv$/i.test(f.name));
    const box = document.getElementById("import-results");
    if (!list.length) { box.replaceChildren(el("p", { class: "neg" }, "No .csv files found. Export the log from PokerNow (Log → Download full log).")); return; }
    box.replaceChildren(el("p", {}, `Importing ${list.length} file(s)...`));
    try {
        const payload = await Promise.all(list.map(async (f) => ({ name: f.name, text: await f.text() })));
        const results = await api("/api/import", { files: payload });
        box.replaceChildren(el("h2", {}, "Import results"), el("ul", { class: "plain" }, ...results.map((r) => el("li", { class: r.ok ? "" : "neg" },
            r.ok ? `${r.file_name}: ${r.added} new hands${r.already_had ? `, ${r.already_had} already imported` : ""}, ${r.players} players` +
                `${r.incomplete ? `, ${r.incomplete} incomplete skipped` : ""}` +
                (r.first_hand > 1 ? `, starts at hand #${r.first_hand}: PokerNow left the earlier hands out of this download` : "") +
                (r.you ? "" : r.dealt_to_you ? " (couldn't tell which player is you)" : " (you weren't dealt in: the log has none of your hole cards)")
                : `${r.file_name}: failed (${r.error})`))),
            el("button", { class: "secondary", onclick: () => box.replaceChildren() }, "Dismiss"));
    } catch (err) {
        box.replaceChildren(el("p", { class: "neg" }, `Import failed: ${err.message}`));
    }
    route();
}
document.getElementById("file-input").addEventListener("change", (e) => { importFiles(e.target.files); e.target.value = ""; });
const drop = document.getElementById("drop");
let drag_depth = 0;
window.addEventListener("dragenter", (e) => { e.preventDefault(); drag_depth++; drop.classList.add("show"); });
window.addEventListener("dragleave", () => { if (--drag_depth <= 0) { drag_depth = 0; drop.classList.remove("show"); } });
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => { e.preventDefault(); drag_depth = 0; drop.classList.remove("show"); importFiles(e.dataTransfer.files); });

// ---------- routing ----------
const NAV = { now: ["now"], players: ["players", "player"], games: ["games", "game"], results: ["results"], leaks: ["leaks"] };
let rendered_hash = null;
let route_count = 0;
async function route(live) {
    const this_route = ++route_count;
    clearTimeout(refresh_timer);
    refresh_waiting = false;
    const view = document.getElementById("view");
    const hash = location.hash;
    const [, page, arg] = (hash || "#/players").split("/");
    for (const [name, pages] of Object.entries(NAV)) {
        document.getElementById(`nav-${name}`).classList.toggle("active", pages.includes(page) || (name === "players" && !Object.values(NAV).flat().includes(page)));
    }
    // built off-screen, and shown only if no other page was opened while it loaded
    const target = el("div");
    let refresh = false;
    try {
        if (page === "now") refresh = await showNow(target, live);
        else if (page === "player" && arg) await showPlayer(target, decodeURIComponent(arg));
        else if (page === "game" && arg) refresh = await showGame(target, decodeURIComponent(arg));
        else if (page === "games") await showGames(target);
        else if (page === "results") await showResults(target);
        else if (page === "leaks") await showLeaks(target);
        else await showPlayers(target);
    } catch (err) {
        target.replaceChildren(el("div", { class: "panel neg" }, `Could not load: ${err.message}`));
        // the live page keeps trying (the bot may be restarting)
        refresh = page === "now";
    }
    if (this_route !== route_count) return;
    // a refresh of the same page keeps tables scrolled where they were (on a phone they scroll sideways)
    const scrolled = rendered_hash === hash ? [...view.querySelectorAll(".scroll")].map((s) => s.scrollLeft) : [];
    view.replaceChildren(...target.childNodes);
    view.querySelectorAll(".scroll").forEach((s, i) => { s.scrollLeft = scrolled[i] || 0; });
    rendered_hash = hash;
    scheduleRefresh(refresh);
    // header counts and the live dot stay current (cheap when nothing changed)
    if (page !== "players") loadSummary().catch(() => {});
    if (page !== "now") api("/api/live").then((g) => setLiveDot(!!g)).catch(() => {});
}
window.addEventListener("hashchange", () => route());

// the landing page: the game being played right now if there is one, otherwise the players
(async () => {
    if (location.hash) return route();
    const live = await api("/api/live").catch(() => null);
    history.replaceState(null, "", live ? "#/now" : "#/players");
    route(live);
})();
</script>
